# Esperanza — Production Stack
# Runs PostgreSQL + Next.js + Nginx reverse proxy (TLS via Let's Encrypt when certs exist).
#
# Usage:
#   cp .env.example .env   # fill in production values
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec -T app prisma migrate deploy
#   docker compose -f docker-compose.prod.yml exec -T app tsx prisma/seed.ts
#   docker compose -f docker-compose.prod.yml logs -f

services:
  postgres:
    image: postgres:16-alpine
    container_name: esperanza-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - esperanza-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    networks:
      - esperanza-net
    command: --load-only en,es --update-models

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: esperanza-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-event-images}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      TRANSLATION_BASE_URL: http://libretranslate:5000
      TRANSLATION_TIMEOUT_MS: ${TRANSLATION_TIMEOUT_MS:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      libretranslate:
        condition: service_started
    networks:
      - esperanza-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: esperanza-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LETSENCRYPT_DOMAIN: ${LETSENCRYPT_DOMAIN:?set in .env e.g. yourname.duckdns.org}
    volumes:
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - esperanza-net

  # Renews certs on a loop. After a successful renew, reload nginx:
  #   docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
  certbot:
    image: certbot/certbot
    container_name: esperanza-certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

networks:
  esperanza-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local
