# ============================================================
# Esperanza — Nginx Reverse Proxy Configuration
# ============================================================
# Sits in front of the Next.js app. Handles:
#   - HTTPS termination (via Let's Encrypt / Certbot)
#   - Security headers
#   - Rate limiting on auth endpoints
#   - Gzip compression
#   - Static file caching
# ============================================================

# rate limiting zone for auth endpoints (brute-force protection)
# 10 requests per second per IP, burst of 20
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

# general API rate limiting
# 30 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream nextjs_app {
    server app:3000;
}

# --- HTTP server (redirect to HTTPS when certs are ready) ---
server {
    listen 80;
    server_name _;

    # certbot ACME challenge (needed for Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # for now, serve traffic on HTTP
    # once HTTPS is configured, uncomment the return 301 below
    # and uncomment the HTTPS server block at the bottom
    # return 301 https://$host$request_uri;

    # --- security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # --- gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- auth endpoints: strict rate limiting ---
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- general API endpoints: moderate rate limiting ---
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Next.js static assets (long cache) ---
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # --- everything else: proxy to Next.js ---
    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket support (for HMR during dev if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

