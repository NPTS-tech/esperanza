<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Esperanza - Offline</title>
    <style>
        :root {
            --color-primary: #B7714A;
            --color-bg: #FAF7F2;
            --color-text: #2C1810;
            --color-text-secondary: #6B5C52;
            --color-card: #FFFFFF;
            --radius: 1rem;
        }
        body {
            margin: 0;
            padding: env(safe-area-inset-top, 24px) 1.5rem env(safe-area-inset-bottom, 24px);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 2rem 1.5rem;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(44, 24, 16, 0.08);
            border: 1px solid rgba(183, 113, 74, 0.15);
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.25rem;
            background-color: rgba(183, 113, 74, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-primary);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
            color: var(--color-text);
        }
        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--color-text-secondary);
            margin: 0 0 1.5rem;
        }
        .btn {
            display: inline-block;
            background-color: var(--color-primary);
            color: #FFFFFF;
            font-weight: 600;
            padding: 0.875rem 1.75rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>No Connection</h1>
        <p>You appear to be offline. Esperanza needs an active internet connection to load community resources and services.</p>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
