# Esperanza — Dev Environment (Default)
# Runs ONLY PostgreSQL. Devs run Next.js natively with `npm run dev`.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#   npm run dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: esperanza-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-esperanza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esperanza_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-esperanza}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-esperanza}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    ports:
      - "5001:5000"
    command: --load-only en,es --update-models

volumes:
  postgres_dev_data:
    driver: local
